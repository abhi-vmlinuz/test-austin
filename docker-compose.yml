services:
  db:
    image: mysql:8.0
    container_name: c2e-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: catch2export
      MYSQL_USER: c2e
      MYSQL_PASSWORD: c2e_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - c2e_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: c2e-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node src/database/init.js && node src/seed.js && node src/seed-demo.js; node src/server.js"

  frontend:
    build: ./frontend
    container_name: c2e-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  c2e_mysql:
